<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceOffice Booking System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bookings-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .booking-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .booking-item h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .booking-item p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stat-card h3 {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
            font-size: 14px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tenant-select {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 VoiceOffice Booking System</h1>
            <p>Manage your bookings with ease</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="stats">
            <div class="stat-card">
                <h3 id="totalTenants">0</h3>
                <p>Total Tenants</p>
            </div>
            <div class="stat-card">
                <h3 id="totalBookings">0</h3>
                <p>Total Bookings</p>
            </div>
            <div class="stat-card">
                <h3 id="todayBookings">0</h3>
                <p>Today's Bookings</p>
            </div>
        </div>

        <div class="tenant-select">
            <div class="form-group">
                <label>Select Tenant</label>
                <select id="tenantSelect">
                    <option value="">-- Select a tenant --</option>
                </select>
            </div>
        </div>

        <div class="dashboard">
            <!-- Create Tenant Card -->
            <div class="card">
                <h2>➕ Create New Tenant</h2>
                <form id="createTenantForm">
                    <div class="form-group">
                        <label>Business Name *</label>
                        <input type="text" id="tenantName" required placeholder="e.g., My Hair Salon">
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="tenantEmail" required placeholder="contact@business.com">
                    </div>
                    <div class="form-group">
                        <label>Phone *</label>
                        <input type="tel" id="tenantPhone" required placeholder="+27123456789">
                    </div>
                    <button type="submit" class="btn">Create Tenant</button>
                </form>
            </div>

            <!-- Create Booking Template Card -->
            <div class="card">
                <h2>📋 Create Booking Template</h2>
                <form id="createTemplateForm">
                    <div class="form-group">
                        <label>Template Name *</label>
                        <input type="text" id="templateName" required placeholder="e.g., Standard Haircut">
                    </div>
                    <div class="form-group">
                        <label>Service Type *</label>
                        <input type="text" id="serviceType" required placeholder="e.g., Haircut">
                    </div>
                    <div class="form-group">
                        <label>Duration (minutes) *</label>
                        <input type="number" id="duration" required placeholder="60">
                    </div>
                    <div class="form-group">
                        <label>Default Message</label>
                        <textarea id="defaultMessage" rows="3" placeholder="Thank you for booking..."></textarea>
                    </div>
                    <button type="submit" class="btn">Create Template</button>
                </form>
            </div>

            <!-- Create Booking Card -->
            <div class="card">
                <h2>📅 Create New Booking</h2>
                <form id="createBookingForm">
                    <div class="form-group">
                        <label>Customer Name *</label>
                        <input type="text" id="customerName" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Customer Email *</label>
                        <input type="email" id="customerEmail" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label>Customer Phone</label>
                        <input type="tel" id="customerPhone" placeholder="+27123456789">
                    </div>
                    <div class="form-group">
                        <label>Service Type *</label>
                        <input type="text" id="bookingService" required placeholder="Haircut">
                    </div>
                    <div class="form-group">
                        <label>Booking Date *</label>
                        <input type="date" id="bookingDate" required>
                    </div>
                    <div class="form-group">
                        <label>Booking Time *</label>
                        <input type="time" id="bookingTime" required>
                    </div>
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="bookingNotes" rows="2" placeholder="Any special requirements..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-secondary">Create Booking</button>
                </form>
            </div>
        </div>

        <div class="card">
            <h2>📊 Recent Bookings</h2>
            <div class="loading" id="loadingBookings">
                <div class="spinner"></div>
                <p>Loading bookings...</p>
            </div>
            <div id="bookingsList" class="bookings-list"></div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let currentTenantId = null;
        const tenants = [];

        // Show alert message
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type} show`;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // Create Tenant
        document.getElementById('createTenantForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                name: document.getElementById('tenantName').value,
                email: document.getElementById('tenantEmail').value,
                phone: document.getElementById('tenantPhone').value
            };

            try {
                const response = await fetch(`${API_URL}/api/tenants`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const tenant = await response.json();
                    showAlert(`✅ Tenant "${tenant.name}" created successfully!`);
                    e.target.reset();
                    addTenantToSelect(tenant);
                    updateStats();
                } else {
                    const error = await response.json();
                    showAlert(`❌ Error: ${error.error}`, 'error');
                }
            } catch (error) {
                showAlert(`❌ Error: ${error.message}`, 'error');
            }
        });

        // Add tenant to select dropdown
        function addTenantToSelect(tenant) {
            const select = document.getElementById('tenantSelect');
            const option = document.createElement('option');
            option.value = tenant.tenant_id;
            option.textContent = tenant.name;
            select.appendChild(option);
            tenants.push(tenant);
        }

        // Handle tenant selection
        document.getElementById('tenantSelect').addEventListener('change', (e) => {
            currentTenantId = e.target.value;
            if (currentTenantId) {
                loadBookings(currentTenantId);
            }
        });

        // Create Template
        document.getElementById('createTemplateForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentTenantId) {
                showAlert('⚠️ Please select a tenant first', 'error');
                return;
            }

            const data = {
                tenant_id: currentTenantId,
                template_name: document.getElementById('templateName').value,
                service_type: document.getElementById('serviceType').value,
                duration_minutes: parseInt(document.getElementById('duration').value),
                default_message: document.getElementById('defaultMessage').value
            };

            try {
                const response = await fetch(`${API_URL}/api/templates`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('✅ Template created successfully!');
                    e.target.reset();
                } else {
                    const error = await response.json();
                    showAlert(`❌ Error: ${error.error}`, 'error');
                }
            } catch (error) {
                showAlert(`❌ Error: ${error.message}`, 'error');
            }
        });

        // Create Booking
        document.getElementById('createBookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentTenantId) {
                showAlert('⚠️ Please select a tenant first', 'error');
                return;
            }

            const data = {
                tenant_id: currentTenantId,
                customer_name: document.getElementById('customerName').value,
                customer_email: document.getElementById('customerEmail').value,
                customer_phone: document.getElementById('customerPhone').value,
                service_type: document.getElementById('bookingService').value,
                booking_date: document.getElementById('bookingDate').value,
                booking_time: document.getElementById('bookingTime').value,
                notes: document.getElementById('bookingNotes').value
            };

            try {
                const response = await fetch(`${API_URL}/api/bookings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const booking = await response.json();
                    showAlert(`✅ Booking created for ${booking.customer_name}!`);
                    e.target.reset();
                    loadBookings(currentTenantId);
                    updateStats();
                } else {
                    const error = await response.json();
                    showAlert(`❌ Error: ${error.error}`, 'error');
                }
            } catch (error) {
                showAlert(`❌ Error: ${error.message}`, 'error');
            }
        });

        // Load bookings for tenant
        async function loadBookings(tenantId) {
            const loadingEl = document.getElementById('loadingBookings');
            const listEl = document.getElementById('bookingsList');

            loadingEl.classList.add('show');
            listEl.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}/api/bookings/${tenantId}`);
                
                if (response.ok) {
                    const bookings = await response.json();
                    loadingEl.classList.remove('show');

                    if (bookings.length === 0) {
                        listEl.innerHTML = '<p style="text-align: center; color: #999;">No bookings yet</p>';
                        return;
                    }

                    bookings.forEach(booking => {
                        const item = document.createElement('div');
                        item.className = 'booking-item';
                        item.innerHTML = `
                            <h4>${booking.customer_name}</h4>
                            <p>📧 ${booking.customer_email}</p>
                            <p>🔧 ${booking.service_type}</p>
                            <p>📅 ${booking.booking_date} at ${booking.booking_time}</p>
                            <p>Status: <strong>${booking.status}</strong></p>
                        `;
                        listEl.appendChild(item);
                    });
                } else {
                    loadingEl.classList.remove('show');
                    listEl.innerHTML = '<p style="text-align: center; color: #999;">Error loading bookings</p>';
                }
            } catch (error) {
                loadingEl.classList.remove('show');
                listEl.innerHTML = '<p style="text-align: center; color: #999;">Error loading bookings</p>';
            }
        }

        // Update stats
        async function updateStats() {
            document.getElementById('totalTenants').textContent = tenants.length;
            // In a real app, you'd fetch these from the API
        }

        // Set default date to today
        document.getElementById('bookingDate').valueAsDate = new Date();

        // Initialize
        showAlert('👋 Welcome to VoiceOffice Booking System! Start by creating a tenant.', 'success');
    </script>
</body>
</html>
